apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
  namespace: url-shortener-namespace
data:
  alerts.yaml: |
    groups:
      - name: url-shortener.service
        interval: 30s
        rules:
          - alert: UrlServiceHighErrorRate
            expr: |
              (
                sum(rate(http_server_requests_seconds_count{
                  app="url-service",
                  outcome="SERVER_ERROR",
                  uri!~"/actuator.*"
                }[5m]))
                /
                sum(rate(http_server_requests_seconds_count{
                  app="url-service",
                  uri!~"/actuator.*"
                }[5m]))
              ) > 0.05
              and
              sum(rate(http_server_requests_seconds_count{
                app="url-service",
                uri!~"/actuator.*"
              }[5m])) > 0.2
            for: 2m
            labels:
              severity: critical
              service: url-service
            annotations:
              summary: "url-service: больше 5% ответов 5xx"
              description: "Доля 5xx за 5 минут: {{ $value | humanizePercentage }} (порог 5%)."

          - alert: UrlTokenGenerationSlow
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(url_token_generation_duration_seconds_bucket{app="url-service"}[5m])
                )
              ) > 1
              and
              sum(rate(url_token_generation_duration_seconds_count{app="url-service"}[5m])) > 0.2
            for: 2m
            labels:
              severity: warning
              service: url-service
            annotations:
              summary: "url-service: p95 генерации короткого токена выше 1 секунды"
              description: "p95 = {{ $value | humanizeDuration }} за последние 5 минут (порог 1s)."

      - name: url-shortener.runtime
        interval: 30s
        rules:
          - alert: JvmHeapUsageHigh
            expr: |
              (
                sum by (app, pod) (jvm_memory_used_bytes{app="url-service", area="heap"})
                /
                sum by (app, pod) (jvm_memory_max_bytes{app="url-service", area="heap"} > 0)
              ) > 0.85
            for: 5m
            labels:
              severity: warning
              service: url-service
            annotations:
              summary: "url-service: heap заполнен больше чем на 85%"
              description: "Использовано {{ $value | humanizePercentage }} heap."

          - alert: HikariConnectionPoolSaturation
            expr: |
              sum by (app, pod) (
                hikaricp_connections_pending{app="url-service"}
              ) > 0
            for: 2m
            labels:
              severity: critical
              service: url-service
            annotations:
              summary: "url-service: закончились соединения в HikariCP"
              description: "В очереди пула {{ $value }} запросов."
