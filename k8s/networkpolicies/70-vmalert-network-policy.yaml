apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmalert-network-policy
  namespace: url-shortener-namespace
spec:
  podSelector:
    matchLabels:
      app: vmalert
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics-single
      ports:
        - protocol: TCP
          port: 8428
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 9093
