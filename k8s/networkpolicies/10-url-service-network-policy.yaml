apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: url-service-network-policy
  namespace: url-shortener-namespace
spec:
  podSelector:
    matchLabels:
      app: url-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics-single
      ports:
        - protocol: TCP
          port: 8082
    - from:
        - podSelector:
            matchLabels:
              app: slo-prober
      ports:
        - protocol: TCP
          port: 80
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: moderation-service
      ports:
        - protocol: TCP
          port: 8081
    - to:
        - podSelector:
            matchLabels:
              app: url-postgres
      ports:
        - protocol: TCP
          port: 5432
