apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vmsingle-network-policy
  namespace: url-shortener-namespace
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-single
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: slo-prober
      ports:
        - protocol: TCP
          port: 8428
    - from:
        - podSelector:
            matchLabels:
              app: vmalert
      ports:
        - protocol: TCP
          port: 8428
