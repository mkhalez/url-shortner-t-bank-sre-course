apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: url-service
  namespace: url-shortener-namespace
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - headers:
            - type: Exact
              name: x-user-group
              value: beta
      backendRefs:
        - name: url-service-v2
          port: 80
    - backendRefs:
        - name: url-service
          port: 80