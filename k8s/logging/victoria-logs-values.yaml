server:
  retentionPeriod: 7d

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  persistentVolume:
    size: 1Gi

vector:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  customConfig:
    transforms:
      parser:
        source: |
          parsed = parse_json(.message) ?? null
          if is_object(parsed) {
            .log = parsed
            .log_format = "json"
            del(.log.ecs)
            del(.log.process.pid)
          } else {
            .log = .message
            .log_format = "text"
          }
          del(.message)
          
          del(.kubernetes.node_labels)
          del(.kubernetes.namespace_labels)
          del(.kubernetes.pod_annotations)
          del(.kubernetes.pod_labels)
          del(.kubernetes.pod_ip)
          del(.kubernetes.pod_ips)
          del(.kubernetes.pod_uid)
          del(.kubernetes.pod_node_name)
          del(.kubernetes.pod_owner)
          del(.kubernetes.container_id)
          del(.kubernetes.container_image_id)
          del(.file)
          del(.source_type)
          
      app_filter:
        type: filter
        inputs: [parser]
        condition: |
          .kubernetes.pod_namespace == "url-shortener-namespace" &&
          (.kubernetes.container_name == "url-service" ||
           .kubernetes.container_name == "moderation-service")

    sinks:
      vlogs:
        inputs: [app_filter]
