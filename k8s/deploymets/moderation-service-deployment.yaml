apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-service-deployment
  namespace: url-shortener-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moderation-service
  template:
    metadata:
      labels:
        app: moderation-service
    spec:
      containers:
        - name: moderation-service
          image: mkhalez/moderation-service:0.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: moderation-http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: moderation-service-config
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: moderation-http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: moderation-http
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-service
  namespace: url-shortener-namespace
spec:
  type: ClusterIP
  selector:
    app: moderation-service
  ports:
    - protocol: TCP
      port: 8081
      targetPort: moderation-http