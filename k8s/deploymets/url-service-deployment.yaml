apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-service-deployment
  namespace: url-shortener-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
      labels:
        app: url-service
    spec:
      containers:
        - name: url-service
          image: mkhalez/url-service:0.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: url-http
              containerPort: 80
            - name: metrics
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: url-service-config
            - secretRef:
                name: url-shortener-secrets
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: url-service
  namespace: url-shortener-namespace
spec:
  type: ClusterIP
  selector:
    app: url-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: url-http