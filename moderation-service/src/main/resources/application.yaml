spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: moderation-service

server:
  port: ${MODERATION_SERVICE_PORT}

app:
  moderation:
    banned-words:
      - spamm
      - slopp
      - booot

management:
  health:
    probes:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  server:
    port: ${MODERATION_SERVICE_METRICS_PORT}


logging:
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: moderation-service
        environment: dev